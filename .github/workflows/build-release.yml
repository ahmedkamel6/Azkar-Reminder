name: Build and Multi-Platform Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build native Windows app
        run: |
          cmake -S . -B build -DBUILD_QT_APP=OFF -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify binary and audio
        run: |
          if (!(Test-Path "build/bin/Release/AzkarReminder.exe")) { throw "Executable not found" }
          if (!(Test-Path "build/bin/Release/audio/diode_matrix.mp3")) { throw "Audio asset not found" }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/AzkarReminder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build MSIX with the registered Store identity
        run: ./installer/msix/build_msix.ps1
      - name: Test native executable and Windows packages
        timeout-minutes: 5
        run: |
          ./scripts/smoke_windows.ps1 -Executable build/bin/Release/AzkarReminder.exe
          ./scripts/smoke_windows_packages.ps1 -SetupPath release/AzkarReminder-Windows-Setup.exe -PackagePath release/AzkarReminder-1.2.5.msix -ReferenceExecutable build/bin/Release/AzkarReminder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AzkarReminder-Windows-Packages
          path: |
            release/*.exe
            release/*.msix*
          if-no-files-found: error

  check-windows-qt:
    name: Windows optional Qt frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build both Windows frontends and run tests
        run: |
          cmake -S . -B build-qt -DBUILD_QT_APP=ON -DBUILD_TESTING=ON
          cmake --build build-qt --config Release --parallel
          ctest --test-dir build-qt -C Release --output-on-failure

  build-linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools qt6-wayland \
            libxcb1-dev libgl1-mesa-dev libasound2-dev libpulse-dev file curl patchelf dbus-x11 xvfb
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_APP=ON -DBUILD_TESTING=ON
          cmake --build build --parallel 4
      - name: Run core, audio, UI and executable tests
        timeout-minutes: 5
        run: |
          dbus-run-session -- ctest --test-dir build --output-on-failure
          dbus-run-session -- bash scripts/smoke_linux.sh build/azkar_reminder
          dbus-run-session -- xvfb-run -a env QT_QPA_PLATFORM=xcb bash scripts/smoke_linux.sh build/azkar_reminder
          xvfb-run -a env AZKAR_TEST_X11=1 ctest --test-dir build -R X11FullScreen --output-on-failure
      - name: Verify core-only configuration
        run: |
          cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_APP=OFF
          cmake --build build-core --parallel 4
          ctest --test-dir build-core --output-on-failure
      - name: Package Qt libraries and plugins
        run: bash scripts/package_linux.sh build release
      - name: Test AppImage in a container without Qt
        run: |
          docker run --rm -v "$PWD:/source:ro" ubuntu:22.04 bash -c '
            apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libxkbcommon0 libdbus-1-3 &&
            cp /source/release/*.AppImage* /tmp/ && cd /tmp && sha256sum --check *.sha256 &&
            chmod +x *.AppImage && bash /source/scripts/smoke_linux.sh /tmp/AzkarReminder-Linux-x86_64.AppImage --appimage-extract-and-run'
      - uses: actions/upload-artifact@v4
        with:
          name: AzkarReminder-Linux-AppImage
          path: release/*.AppImage*
          if-no-files-found: error

  build-macos:
    name: macOS universal candidate
    runs-on: macos-14
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install official Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          cache: true
      - name: Configure and build both architectures
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_APP=ON -DBUILD_TESTING=ON \
            '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Import signing certificate and notarization credentials
        if: env.MACOS_SIGNING_IDENTITY != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          xcrun notarytool store-credentials azkar-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo 'MACOS_NOTARY_PROFILE=azkar-ci' >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Deploy Qt, verify architectures and package DMG
        run: bash scripts/package_macos.sh build release
      - name: Mount DMG and run the deployed Cocoa application
        timeout-minutes: 5
        run: bash scripts/smoke_macos.sh release/*.dmg
      - name: Remove signing material
        if: always() && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          rm -f "$RUNNER_TEMP/signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: AzkarReminder-macOS-DMG
          path: release/*.dmg*
          if-no-files-found: error

  release:
    name: Create release draft
    needs: [build-windows, check-windows-qt, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: Azkar Reminder ${{ github.ref_name }}
          files: |
            AzkarReminder-Windows-Packages/*
            AzkarReminder-Linux-AppImage/*
            AzkarReminder-macOS-DMG/*
